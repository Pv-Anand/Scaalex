{% extends "base.html" %}
{% block title %}Edit Update — {{ client.name }}{% endblock %}
{% block content %}
{% include "_client_subnav.html" %}

<div class="card" style="max-width:680px;">
  <h2 class="section-title">Edit Update</h2>
  <form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-row">
      <div class="form-group">
        <label>Interaction Type</label>
        <select name="interaction_type">
          {% for t in interaction_types %}
          <option value="{{ t }}" {{ 'selected' if t == conversation.interaction_type }}>{{ t }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Date &amp; Time</label>
        <input type="datetime-local" name="date" value="{{ conversation.date.strftime('%Y-%m-%dT%H:%M') }}">
      </div>
    </div>
    <div class="form-group">
      <label>Participants</label>
      <input type="text" name="participants" value="{{ conversation.participants_display }}">
    </div>
    <div class="form-group">
      <label>Discussion / Notes</label>
      <textarea name="raw_notes" rows="8">{{ conversation.raw_notes }}</textarea>
    </div>

    {% if conversation.extraction_status == 'confirmed' %}
    <hr class="divider">
    <div class="form-group">
      <label>Confirmed Summary</label>
      <textarea name="summary" rows="3">{{ conversation.summary or '' }}</textarea>
    </div>
    <div class="form-group">
      <label>Important Context</label>
      <textarea name="important_context" rows="3">{{ conversation.important_context or '' }}</textarea>
    </div>
    <div class="form-group">
      <label>Open Questions</label>
      <textarea name="open_questions" rows="3" placeholder="One per line">{{ conversation.open_questions|join('\n') }}</textarea>
      <div class="form-hint">One question per line.</div>
    </div>
    {% endif %}

    <div class="form-actions">
      <button type="submit" class="btn">Save Changes</button>
      <a href="{{ url_for('conversations.detail', slug=client.slug, conversation_id=conversation.id) }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
