{% extends "base.html" %}
{% block title %}Team — Scaalex Intelligence{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <div class="page-eyebrow">Account</div>
    <h1>Team</h1>
  </div>
</div>

<div class="table-wrap" style="max-width:720px;">
  <table class="table">
    <thead><tr><th>Name</th><th>Email</th><th></th></tr></thead>
    <tbody>
      {% for u in users %}
      <tr>
        <td>{{ u.name }}</td>
        <td>{{ u.email }}</td>
        <td style="white-space:nowrap;">
          <button type="button" class="link-btn small" onclick="toggleResetPassword({{ u.id }})">Reset Password</button>
        </td>
      </tr>
      <tr id="reset-password-row-{{ u.id }}" style="display:none;">
        <td colspan="3" style="background:var(--grey-50); padding:18px;">
          <form method="POST" action="{{ url_for('auth.reset_password', user_id=u.id) }}" style="display:flex; align-items:flex-end; gap:12px;">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group" style="flex:1; margin-bottom:0;">
              <label>New password for {{ u.name }}</label>
              <input type="text" name="new_password" placeholder="At least 8 characters" required minlength="8">
            </div>
            <button type="submit" class="btn btn-sm">Save</button>
            <button type="button" class="link-btn small muted" onclick="toggleResetPassword({{ u.id }})">Cancel</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
{% block scripts %}
<script>
function toggleResetPassword(userId) {
  const row = document.getElementById('reset-password-row-' + userId);
  row.style.display = row.style.display === 'none' ? 'table-row' : 'none';
}
</script>
{% endblock %}
