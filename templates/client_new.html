{% extends "base.html" %}
{% block title %}Add Client - Scaalex Intelligence{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <div class="page-eyebrow">Clients</div>
    <h1>Add Client</h1>
  </div>
</div>

<div class="card" style="max-width:520px;">
  <form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label>Client Name</label>
      <input type="text" name="name" required autofocus placeholder="e.g. Meridian Capital">
    </div>
    <div class="form-group">
      <label>Engagement Type</label>
      <input type="text" name="engagement_type" placeholder="e.g. M&A Advisory, Capital Raise, Growth Advisory">
    </div>
    <div class="form-actions">
      <button type="submit" class="btn">Add Client</button>
      <a href="{{ url_for('home.index') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
