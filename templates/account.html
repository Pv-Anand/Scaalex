{% extends "base.html" %}
{% block title %}My Profile - {{ brand.name }} Intelligence{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <div class="page-eyebrow">Account</div>
    <h1>My Profile</h1>
  </div>
</div>

<div class="card" style="max-width:480px;">
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label>Name</label>
      <input type="text" name="name" value="{{ current_user.name }}" required>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="text" value="{{ current_user.email }}" disabled>
      <div class="form-hint">Contact an administrator to change your email.</div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn">Save Changes</button>
    </div>
  </form>
</div>
{% endblock %}
