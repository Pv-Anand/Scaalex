{% extends "base.html" %}
{% block title %}Settings — {{ client.name }}{% endblock %}
{% block content %}
{% include "_client_subnav.html" %}

<div class="card" style="max-width:520px;">
  <form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label>Engagement Status</label>
      <select name="status">
        {% for s in ['Active', 'Paused', 'Closed'] %}
        <option value="{{ s }}" {{ 'selected' if client.status == s }}>{{ s }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Engagement Type</label>
      <input type="text" name="engagement_type" value="{{ client.engagement_type }}">
    </div>
    <div class="form-actions">
      <button type="submit" class="btn">Save Changes</button>
    </div>
  </form>
</div>

<div class="mt-32 small muted">
  Client since {{ client.created_at.strftime('%d %b %Y') }}
</div>
{% endblock %}
