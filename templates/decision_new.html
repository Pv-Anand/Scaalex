{% extends "base.html" %}
{% block title %}Record Decision — {{ client.name }}{% endblock %}
{% block content %}
{% include "_client_subnav.html" %}

<div class="card" style="max-width:600px;">
  <h2 class="section-title">Record Decision</h2>
  <form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label>Decision</label>
      <input type="text" name="decision" required placeholder="e.g. Continue Google Ads campaign">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Date</label>
        <input type="date" name="date" value="{{ client.last_activity.strftime('%Y-%m-%d') if client.last_activity else '' }}">
      </div>
      <div class="form-group">
        <label>Owner</label>
        <input type="text" name="owner" placeholder="e.g. Client CEO">
      </div>
    </div>
    <div class="form-group">
      <label>Context / Rationale</label>
      <textarea name="context" rows="4" placeholder="Why was this decided?"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Status</label>
        <select name="status">
          <option value="Confirmed">Confirmed</option>
          <option value="Needs Confirmation">Needs Confirmation</option>
        </select>
      </div>
      <div class="form-group">
        <label>Source</label>
        <input type="text" name="source_label" placeholder="e.g. Client Meeting — 16 Sep 2026">
      </div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn">Save Decision</button>
      <a href="{{ url_for('decisions.client_list', slug=client.slug) }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
