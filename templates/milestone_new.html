{% extends "base.html" %}
{% block title %}New Milestone — {{ client.name }}{% endblock %}
{% block content %}
{% include "_client_subnav.html" %}

<div class="card" style="max-width:600px;">
  <h2 class="section-title">New Milestone</h2>
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label>Title</label>
      <input type="text" name="title" required placeholder="e.g. Investor Shortlist Finalization">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Status</label>
        <select name="status" id="status-select" onchange="toggleDateFields()">
          <option value="upcoming">Upcoming</option>
          <option value="in_progress">In Progress</option>
          <option value="completed">Completed</option>
        </select>
      </div>
      <div class="form-group">
        <label>Reporting Manager</label>
        <select name="reporting_manager_id">
          <option value="">Unassigned</option>
          {% for m in managers %}
          <option value="{{ m.id }}">{{ m.name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group" id="due-date-group">
        <label>Due Date</label>
        <input type="date" name="due_date">
      </div>
      <div class="form-group" id="date-group" style="display:none;">
        <label>Completion Date</label>
        <input type="date" name="date">
      </div>
    </div>
    <div class="form-group">
      <label style="display:flex; align-items:center; gap:8px; font-weight:400;">
        <input type="checkbox" name="visible_to_client" value="1" checked>
        Visible to client on their portal
      </label>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn">Save Milestone</button>
      <a href="{{ url_for('reports.reports', slug=client.slug) }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script>
function toggleDateFields() {
  const completed = document.getElementById('status-select').value === 'completed';
  document.getElementById('date-group').style.display = completed ? '' : 'none';
  document.getElementById('due-date-group').style.display = completed ? 'none' : '';
}
</script>
{% endblock %}
