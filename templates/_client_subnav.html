<div class="page-header">
  <div>
    <div class="page-eyebrow">{{ client.engagement_type }}</div>
    <h1>{{ client.name }}</h1>
  </div>
  <div class="flex-gap">
    <form action="{{ url_for('search.client_search', slug=client.slug) }}" method="GET">
      <input type="search" name="q" placeholder="Search this client…" style="width:220px;">
    </form>
    <form method="POST" action="{{ url_for('conversations.sync', slug=client.slug) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="btn btn-secondary" {{ 'disabled title="Nothing new to sync"' | safe if not sync_pending_count }}>
        Sync{% if sync_pending_count %} ({{ sync_pending_count }}){% endif %}
      </button>
    </form>
    <a href="{{ url_for('conversations.new', slug=client.slug) }}" class="btn">+ Add Update</a>
  </div>
</div>
<div class="subnav">
  <a href="{{ url_for('clients.overview', slug=client.slug) }}" class="{{ 'active' if active_tab == 'overview' }}">Overview</a>
  <a href="{{ url_for('action_items.client_list', slug=client.slug) }}" class="{{ 'active' if active_tab in ('action_items', 'decisions') }}">Action</a>
  <a href="{{ url_for('documents.client_list', slug=client.slug) }}" class="{{ 'active' if active_tab == 'documents' }}">Documents</a>
  <a href="{{ url_for('conversations.sync_history', slug=client.slug) }}" class="{{ 'active' if active_tab == 'sync_history' }}">Sync History</a>
  <a href="{{ url_for('ai_overview.ai_summary', slug=client.slug) }}" class="{{ 'active' if active_tab == 'ai_summary' }}">AI Summary</a>
  <a href="{{ url_for('clients.profile', slug=client.slug) }}" class="{{ 'active' if active_tab == 'profile' }}">Client Profile</a>
  <a href="{{ url_for('reports.reports', slug=client.slug) }}" class="{{ 'active' if active_tab == 'reports' }}">Project Updates</a>
  <a href="{{ url_for('reports.logs', slug=client.slug) }}" class="{{ 'active' if active_tab == 'logs' }}">Logs</a>
</div>
