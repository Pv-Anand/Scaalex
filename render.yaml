services:
  - type: web
    name: scaalex
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180 --max-requests 200 --max-requests-jitter 50"
    healthCheckPath: /login
    disk:
      name: scaalex-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: FORCE_HTTPS
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: FIREFLIES_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: PYTHONUTF8
        value: "1"
      - key: LANG
        value: C.UTF-8
      - key: LC_ALL
        value: C.UTF-8
